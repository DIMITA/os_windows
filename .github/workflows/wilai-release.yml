name: Wilai Release

# Fires on a semver tag (v1.0.0, v1.1.3, …). Builds a release-mode
# .deb and (opportunistically) a WilOS-Core ISO on an Arch container,
# then publishes both as assets on a draft GitHub Release that the
# human can review and promote.
#
# Trigger manually with workflow_dispatch to dry-run against the
# current HEAD without creating a real release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to assume (dry-run only; no release created)"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: build .deb (Debian/Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wilai
    outputs:
      deb_name: ${{ steps.build.outputs.deb_name }}
    steps:
      - uses: actions/checkout@v5

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deb build tools + wayland/xkb dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot \
                                  libxkbcommon-dev libwayland-dev libssl-dev \
                                  pkg-config

      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wilai/target
          key: wilai-release-deb-${{ hashFiles('wilai/Cargo.toml', 'wilai/crates/**/Cargo.toml') }}

      - name: Build the .deb (release mode)
        id: build
        run: |
          ./scripts/build-deb --release
          deb_path=$(ls dist/debian/out/wilai_*.deb | head -1)
          echo "deb_name=$(basename $deb_path)" >> "$GITHUB_OUTPUT"
          sha256sum "$deb_path" | tee "$deb_path.sha256"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v5
        with:
          name: wilai-deb
          path: |
            wilai/dist/debian/out/*.deb
            wilai/dist/debian/out/*.sha256
          if-no-files-found: error

  windows-bridge:
    name: build wilai-bridge .exe (Windows x64)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wilai
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
        with:
          targets: x86_64-pc-windows-gnu
      - name: Install mingw-w64 cross toolchain
        run: |
          sudo apt-get update
          sudo apt-get install -y mingw-w64
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wilai/target
          key: wilai-bridge-win-${{ hashFiles('wilai/Cargo.toml', 'wilai/crates/wilai-bridge/**') }}
      - name: Cross-compile wilai.exe
        run: cargo build -p wilai-bridge --release --target x86_64-pc-windows-gnu --locked
      - name: Stage Windows bridge zip
        run: |
          out=dist/windows/out
          mkdir -p "$out"
          stage="$out/wilai-windows-bridge"
          rm -rf "$stage"
          mkdir -p "$stage"
          # The bridge binary ships as wilai.exe to match the user's
          # expected command name; the cargo target is wilai-bridge
          # to avoid colliding with wilai-cli's `wilai` on Linux.
          cp target/x86_64-pc-windows-gnu/release/wilai-bridge.exe "$stage/wilai.exe"
          cp dist/windows/wilai.ps1 "$stage/"
          cp dist/windows/install.ps1 "$stage/"
          cp dist/windows/README.md  "$stage/README.md"
          version=$(grep -m1 '^version' Cargo.toml | sed 's/.*"\(.*\)".*/\1/')
          (cd "$out" && zip -r "wilai-windows-bridge-${version}.zip" wilai-windows-bridge/)
          sha256sum "$out/wilai-windows-bridge-${version}.zip" | tee "$out/wilai-windows-bridge-${version}.zip.sha256"
      - uses: actions/upload-artifact@v5
        with:
          name: wilai-windows-bridge
          path: |
            wilai/dist/windows/out/wilai-windows-bridge-*.zip
            wilai/dist/windows/out/wilai-windows-bridge-*.zip.sha256
          if-no-files-found: error

  # Build the WilOS-Core ISO inside the official Arch container.
  # Needs root privileges (mksquashfs) so we run as root in the
  # container.
  iso:
    name: build WilOS-Core ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso rust cargo git base-devel \
                                         libxkbcommon squashfs-tools \
                                         grub syslinux edk2-shell \
                                         mtools dosfstools

      - uses: actions/checkout@v5

      - name: Build release binaries
        working-directory: wilai
        run: cargo build --workspace --release --locked

      - name: Stage Wilai binaries + tool catalogue into airootfs
        working-directory: wilai
        run: |
          # The ISO's systemd units reference /usr/bin/wilai-daemon and
          # /usr/bin/wilai-shell. Those binaries do not come from any
          # Arch package — they are compiled above and must be copied
          # into airootfs/usr/bin BEFORE mkarchiso packs the squashfs.
          # Same deal for the YAML tool catalogue under
          # /usr/share/wilai/tools/.
          airootfs=dist/arch/releng-core/airootfs
          install -d "$airootfs/usr/bin" "$airootfs/usr/share/wilai/tools/core" \
                     "$airootfs/usr/share/wilai/tools/pentest" \
                     "$airootfs/usr/share/wilai"
          install -Dm755 target/release/wilai         "$airootfs/usr/bin/wilai"
          install -Dm755 target/release/wilai-daemon  "$airootfs/usr/bin/wilai-daemon"
          install -Dm755 target/release/wilai-shell   "$airootfs/usr/bin/wilai-shell"
          install -Dm755 target/release/wilai-hud     "$airootfs/usr/bin/wilai-hud"
          install -Dm755 target/release/wilai-voice   "$airootfs/usr/bin/wilai-voice"
          install -Dm755 target/release/wilai-overlay "$airootfs/usr/bin/wilai-overlay"
          install -Dm644 tools/core/*.yaml    "$airootfs/usr/share/wilai/tools/core/"
          install -Dm644 tools/pentest/*.yaml "$airootfs/usr/share/wilai/tools/pentest/"
          install -Dm644 config/wilai.toml.example \
                         "$airootfs/usr/share/wilai/wilai.toml.example"
          # Enable the two services so the ISO comes up with them live.
          install -d "$airootfs/etc/systemd/system/multi-user.target.wants"
          ln -sf /etc/systemd/system/wilai-daemon.service \
                 "$airootfs/etc/systemd/system/multi-user.target.wants/wilai-daemon.service"
          ln -sf /etc/systemd/system/wilai-shell.service \
                 "$airootfs/etc/systemd/system/multi-user.target.wants/wilai-shell.service"
          echo "staged into airootfs:"
          ls -lh "$airootfs/usr/bin/" "$airootfs/usr/share/wilai/tools/core/" | head -30

      - name: mkarchiso wilos-core
        working-directory: wilai
        run: |
          mkdir -p out iso-work
          mkarchiso -v -w iso-work -o out dist/arch/releng-core/
          ls -lh out/

      - name: Hash + rename
        working-directory: wilai
        run: |
          cd out
          iso=$(ls wilos-core-*.iso | head -1)
          sha256sum "$iso" | tee "$iso.sha256"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v5
        with:
          name: wilos-core-iso
          path: |
            wilai/out/wilos-core-*.iso
            wilai/out/wilos-core-*.sha256
          if-no-files-found: error
        continue-on-error: true

  release:
    name: publish GitHub Release
    needs: [deb, windows-bridge, iso]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Download .deb
        uses: actions/download-artifact@v5
        with:
          name: wilai-deb
          path: dist/
      - name: Download Windows bridge
        uses: actions/download-artifact@v5
        with:
          name: wilai-windows-bridge
          path: dist/
      - name: Download ISO
        uses: actions/download-artifact@v5
        with:
          name: wilos-core-iso
          path: dist/
        continue-on-error: true
      - name: Show what we got
        run: ls -lh dist/
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.deb.sha256
            dist/wilai-windows-bridge-*.zip
            dist/wilai-windows-bridge-*.zip.sha256
            dist/wilos-core-*.iso
            dist/wilos-core-*.sha256
