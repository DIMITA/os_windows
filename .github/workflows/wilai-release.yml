name: Wilai Release

# Fires on a semver tag (v1.0.0, v1.1.3, …). Builds a release-mode
# .deb and (opportunistically) a WilOS-Core ISO on an Arch container,
# then publishes both as assets on a draft GitHub Release that the
# human can review and promote.
#
# Trigger manually with workflow_dispatch to dry-run against the
# current HEAD without creating a real release.

on:
  push:
    tags:
      - "v[0-9]+.[0-9]+.[0-9]+*"
  workflow_dispatch:
    inputs:
      tag:
        description: "Semver tag to assume (dry-run only; no release created)"
        required: false
        default: "v0.0.0-dev"

permissions:
  contents: write

env:
  CARGO_TERM_COLOR: always

jobs:
  deb:
    name: build .deb (Debian/Ubuntu)
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wilai
    outputs:
      deb_name: ${{ steps.build.outputs.deb_name }}
    steps:
      - uses: actions/checkout@v4

      - uses: dtolnay/rust-toolchain@stable

      - name: Install deb build tools + libxkbcommon
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev fakeroot libxkbcommon-dev

      - uses: actions/cache@v4
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wilai/target
          key: wilai-release-deb-${{ hashFiles('wilai/Cargo.toml', 'wilai/crates/**/Cargo.toml') }}

      - name: Build the .deb (release mode)
        id: build
        run: |
          ./scripts/build-deb --release
          deb_path=$(ls dist/debian/out/wilai_*.deb | head -1)
          echo "deb_name=$(basename $deb_path)" >> "$GITHUB_OUTPUT"
          sha256sum "$deb_path" | tee "$deb_path.sha256"

      - name: Upload .deb artifact
        uses: actions/upload-artifact@v4
        with:
          name: wilai-deb
          path: |
            wilai/dist/debian/out/*.deb
            wilai/dist/debian/out/*.sha256
          if-no-files-found: error

  # Build the WilOS-Core ISO inside the official Arch container.
  # Needs root privileges (mksquashfs) so we run as root in the
  # container.
  iso:
    name: build WilOS-Core ISO
    runs-on: ubuntu-latest
    container:
      image: archlinux:latest
      options: --privileged
    steps:
      - name: Install build deps
        run: |
          pacman -Syu --noconfirm
          pacman -S --noconfirm --needed archiso rust cargo git base-devel \
                                         libxkbcommon squashfs-tools

      - uses: actions/checkout@v4

      - name: Build release binaries
        working-directory: wilai
        run: cargo build --workspace --release --locked

      - name: mkarchiso wilos-core
        working-directory: wilai
        run: |
          mkdir -p out iso-work
          mkarchiso -v -w iso-work -o out dist/arch/releng-core/
          ls -lh out/

      - name: Hash + rename
        working-directory: wilai
        run: |
          cd out
          iso=$(ls wilos-core-*.iso | head -1)
          sha256sum "$iso" | tee "$iso.sha256"

      - name: Upload ISO artifact
        uses: actions/upload-artifact@v4
        with:
          name: wilos-core-iso
          path: |
            wilai/out/wilos-core-*.iso
            wilai/out/wilos-core-*.sha256
          if-no-files-found: error
        continue-on-error: true

  release:
    name: publish GitHub Release
    needs: [deb, iso]
    if: startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Download .deb
        uses: actions/download-artifact@v4
        with:
          name: wilai-deb
          path: dist/
      - name: Download ISO
        uses: actions/download-artifact@v4
        with:
          name: wilos-core-iso
          path: dist/
        continue-on-error: true
      - name: Show what we got
        run: ls -lh dist/
      - name: Create draft release
        uses: softprops/action-gh-release@v2
        with:
          draft: true
          generate_release_notes: true
          files: |
            dist/*.deb
            dist/*.deb.sha256
            dist/wilos-core-*.iso
            dist/wilos-core-*.sha256
