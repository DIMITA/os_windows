name: Wilai CI

on:
  push:
    branches: [main]
    paths:
      - "wilai/**"
      - ".github/workflows/wilai-ci.yml"
  pull_request:
    paths:
      - "wilai/**"
      - ".github/workflows/wilai-ci.yml"
  workflow_dispatch:

env:
  CARGO_TERM_COLOR: always

jobs:
  build-and-test:
    name: build + test (${{ matrix.rust }})
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        rust: [stable]
    defaults:
      run:
        working-directory: wilai

    steps:
      - uses: actions/checkout@v5

      - name: Install Rust toolchain
        uses: dtolnay/rust-toolchain@stable
        with:
          toolchain: ${{ matrix.rust }}
          components: rustfmt

      - name: Install wayland/xkb dev headers (wilai-hud, wilai-shell)
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
                                  libssl-dev pkg-config

      # The MCP integration test spawns a Python-based mock server on stdio.
      - name: Install Python (for MCP mock server)
        uses: actions/setup-python@v6
        with:
          python-version: "3.x"

      - name: Cache cargo registry & git
        uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
          key: cargo-registry-${{ hashFiles('wilai/Cargo.toml', 'wilai/crates/**/Cargo.toml') }}
          restore-keys: cargo-registry-

      - name: Cache target/
        uses: actions/cache@v5
        with:
          path: wilai/target
          key: wilai-target-${{ matrix.rust }}-${{ hashFiles('wilai/Cargo.toml', 'wilai/crates/**/Cargo.toml', 'wilai/crates/**/src/**') }}
          restore-keys: wilai-target-${{ matrix.rust }}-

      - name: cargo fmt --check
        run: cargo fmt --all -- --check
        continue-on-error: true

      - name: cargo build --workspace
        run: cargo build --workspace --locked

      - name: cargo test --workspace
        run: cargo test --workspace --locked --no-fail-fast
        env:
          RUST_LOG: warn
          RUST_BACKTRACE: "1"

      - name: List produced binaries
        run: ls -lh target/debug/wilai target/debug/wilai-daemon target/debug/wilai-shell target/debug/wilai-hud target/debug/wilai-voice target/debug/wilai-overlay

  # Sanity: the ISO profile references wilai binaries; make sure the
  # release build works and produces the four artifacts a staging step
  # would install into airootfs.
  release-build:
    name: release build
    runs-on: ubuntu-latest
    defaults:
      run:
        working-directory: wilai
    steps:
      - uses: actions/checkout@v5
      - uses: dtolnay/rust-toolchain@stable
      - name: Install wayland/xkb dev headers
        run: |
          sudo apt-get update
          sudo apt-get install -y libxkbcommon-dev libwayland-dev \
                                  libssl-dev pkg-config
      - uses: actions/cache@v5
        with:
          path: |
            ~/.cargo/registry
            ~/.cargo/git
            wilai/target
          key: wilai-release-${{ hashFiles('wilai/Cargo.toml', 'wilai/crates/**/Cargo.toml') }}
      - name: cargo build --release
        run: cargo build --workspace --release --locked
      - name: Verify artifacts
        run: |
          test -x target/release/wilai
          test -x target/release/wilai-daemon
          test -x target/release/wilai-shell
          test -x target/release/wilai-hud
          test -x target/release/wilai-voice
          test -x target/release/wilai-overlay
          ls -lh target/release/wilai*
