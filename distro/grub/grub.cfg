insmod part_gpt
insmod fat
insmod iso9660
insmod all_video
insmod font

set default="0"
set timeout=3

menuentry "Boot WilOS Live" {
    set gfxpayload=keep
    linux  /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux \
           archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% \
           quiet splash
    initrd /%INSTALL_DIR%/boot/intel-ucode.img \
           /%INSTALL_DIR%/boot/amd-ucode.img \
           /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "Boot WilOS Live (safe graphics)" {
    linux  /%INSTALL_DIR%/boot/x86_64/vmlinuz-linux \
           archisobasedir=%INSTALL_DIR% archisolabel=%ARCHISO_LABEL% \
           nomodeset
    initrd /%INSTALL_DIR%/boot/intel-ucode.img \
           /%INSTALL_DIR%/boot/amd-ucode.img \
           /%INSTALL_DIR%/boot/x86_64/initramfs-linux.img
}

menuentry "UEFI Shell" {
    chainloader /shellx64.efi
}
