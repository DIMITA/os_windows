<?xml version="1.0" encoding="UTF-8"?>
<!-- WilOS Aurora — Time Machine. Clock with counter-clockwise arrow. -->
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 64 64" width="64" height="64">
  <defs>
    <linearGradient id="aTm" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0%"  stop-color="#7CC8FF"/>
      <stop offset="100%" stop-color="#B198FF"/>
    </linearGradient>
  </defs>
  <circle cx="32" cy="32" r="22"
          fill="#1B1442" stroke="url(#aTm)" stroke-width="1.8"/>
  <!-- 12/3/6/9 ticks -->
  <g stroke="url(#aTm)" stroke-width="2" stroke-linecap="round">
    <line x1="32" y1="14" x2="32" y2="18"/>
    <line x1="50" y1="32" x2="46" y2="32"/>
    <line x1="32" y1="50" x2="32" y2="46"/>
    <line x1="14" y1="32" x2="18" y2="32"/>
  </g>
  <!-- hands -->
  <line x1="32" y1="32" x2="32" y2="20"
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <line x1="32" y1="32" x2="42" y2="32"
        stroke="#FFFFFF" stroke-width="2" stroke-linecap="round"/>
  <circle cx="32" cy="32" r="2" fill="#FFFFFF"/>
  <!-- counter-clockwise arrow ribbon -->
  <path d="M50 16 a18 18 0 1 0 6 18"
        fill="none" stroke="url(#aTm)" stroke-width="2.5"
        stroke-linecap="round"/>
  <polygon points="48,30 56,34 54,26" fill="url(#aTm)"/>
</svg>
