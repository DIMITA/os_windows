# WilOS Aurora — greetd login configuration.
# Live ISO autologins as `live` straight into Hyprland.

[terminal]
vt = 1

[default_session]
command = "tuigreet --remember --time --asterisks --user-menu --cmd Hyprland --greeting 'Welcome to WilOS — Light, made personal.'"
user    = "greeter"

[initial_session]
command = "Hyprland"
user    = "live"
