# WilOS Aurora — Kitty terminal theme.
# Translucent surface so Hyprland's blur shows through.

font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
font_size         12.5
adjust_line_height 110%

cursor_shape      beam
cursor_blink_interval 0.5
scrollback_lines  10000
enable_audio_bell no
copy_on_select    yes
mouse_hide_wait   3.0
strip_trailing_spaces smart

window_padding_width  10
hide_window_decorations yes
background_opacity 0.78
dynamic_background_opacity yes
confirm_os_window_close 0
disable_ligatures cursor

remember_window_size  yes
initial_window_width  900
initial_window_height 540

# Aurora palette
foreground            #ECEEF6
background            #0F0F17
selection_foreground  #0F0F17
selection_background  #B198FF

color0  #15151E
color8  #3A3A4A
color1  #FF8A8A
color9  #FFA0A0
color2  #9BE3C0
color10 #B0EFD0
color3  #FFD580
color11 #FFE0A0
color4  #7CC8FF
color12 #9DDDFF
color5  #B198FF
color13 #C8B5FF
color6  #7DE3E3
color14 #A0EDED
