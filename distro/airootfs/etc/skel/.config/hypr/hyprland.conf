# =====================================================================
# WilOS Aurora — Hyprland configuration
# Glassmorphic compositor with macOS-leaning ergonomics: top menu bar,
# centered floating dock, Spotlight-style launcher, traffic-light style
# window controls left, gestures from the trackpad.
# =====================================================================

# ---- monitors --------------------------------------------------------
monitor = , preferred, auto, 1

# ---- environment -----------------------------------------------------
env = XCURSOR_SIZE,24
env = QT_QPA_PLATFORM,wayland
env = QT_QPA_PLATFORMTHEME,qt6ct
env = GDK_BACKEND,wayland,x11
env = SDL_VIDEODRIVER,wayland
env = MOZ_ENABLE_WAYLAND,1
env = XDG_CURRENT_DESKTOP,Hyprland
env = XDG_SESSION_TYPE,wayland
env = XDG_SESSION_DESKTOP,Hyprland

# ---- autostart -------------------------------------------------------
exec-once = /usr/lib/polkit-kde-authentication-agent-1
exec-once = wl-paste --type text  --watch cliphist store
exec-once = wl-paste --type image --watch cliphist store
exec-once = mako
exec-once = swww-daemon
exec-once = sleep 1 && swww img /usr/share/backgrounds/wilos/aurora.jpg \
                       --transition-type grow --transition-duration 1.2
exec-once = waybar -c ~/.config/waybar/config.jsonc -s ~/.config/waybar/style.css
exec-once = waybar -c ~/.config/waybar/dock.jsonc   -s ~/.config/waybar/dock.css
exec-once = nm-applet --indicator
exec-once = blueman-applet
exec-once = sleep 2 && wilos-firstrun

# ---- input -----------------------------------------------------------
input {
    kb_layout    = fr,us
    kb_options   = grp:alt_shift_toggle
    follow_mouse = 1
    sensitivity  = 0
    accel_profile = adaptive

    touchpad {
        natural_scroll       = true
        disable_while_typing = true
        clickfinger_behavior = true
        tap-to-click         = true
        scroll_factor        = 0.6
    }
}

gestures {
    workspace_swipe              = true
    workspace_swipe_fingers      = 3
    workspace_swipe_distance     = 280
    workspace_swipe_invert       = true
    workspace_swipe_min_speed_to_force = 12
    workspace_swipe_cancel_ratio = 0.5
    workspace_swipe_create_new   = true
}

# ---- general ---------------------------------------------------------
general {
    gaps_in     = 8
    gaps_out    = 16
    border_size = 1
    # Aurora accent gradient on focus, hairline on rest.
    col.active_border   = rgba(7CC8FFcc) rgba(B198FFcc) 45deg
    col.inactive_border = rgba(FFFFFF18)
    layout              = dwindle
    resize_on_border    = true
    allow_tearing       = false
}

# ---- visuals: glass, blur, shadows, rounding -------------------------
decoration {
    rounding = 16

    blur {
        enabled         = true
        size            = 10
        passes          = 4
        new_optimizations = true
        xray            = false
        ignore_opacity  = true
        vibrancy        = 0.2
        vibrancy_darkness = 0.0
        contrast        = 1.05
        brightness      = 1.0
        noise           = 0.012
    }

    # Subtle ambient shadow under windows.
    shadow {
        enabled       = true
        range         = 28
        render_power  = 3
        color         = rgba(0a0a14aa)
        color_inactive = rgba(0a0a1466)
        offset        = 0 8
    }

    # Default opacities so blur actually shows through.
    active_opacity   = 0.92
    inactive_opacity = 0.84
    fullscreen_opacity = 1.0

    dim_inactive  = false
    dim_strength  = 0.10
}

# ---- animations: spring-like, never longer than 250 ms ---------------
animations {
    enabled = true

    bezier = aurora,    0.16, 1.00, 0.30, 1.00
    bezier = standard,  0.40, 0.00, 0.20, 1.00
    bezier = decel,     0.05, 0.70, 0.10, 1.00

    animation = windows,        1, 4, aurora, popin 80%
    animation = windowsOut,     1, 4, decel,  popin 90%
    animation = border,         1, 6, aurora
    animation = borderangle,    1, 30, aurora, loop
    animation = fade,           1, 4, decel
    animation = workspaces,     1, 5, aurora, slide
    animation = specialWorkspace, 1, 5, aurora, slidevert
    animation = layers,         1, 4, decel
}

# ---- layout ----------------------------------------------------------
dwindle {
    pseudotile     = true
    preserve_split = true
    smart_split    = false
    smart_resizing = true
}

master {
    new_status = master
}

misc {
    disable_hyprland_logo  = true
    disable_splash_rendering = true
    force_default_wallpaper = 0
    vfr                    = true
    vrr                    = 1
    background_color       = 0x0f0f17
    enable_swallow         = false
    focus_on_activate      = true
    new_window_takes_over_fullscreen = 2
    middle_click_paste     = false
}

cursor {
    inactive_timeout = 5
    no_warps         = false
}

# ---- per-window rules ------------------------------------------------
# Make popups float and fully transparent, force opaque media.
windowrulev2 = float, class:^(pavucontrol)$
windowrulev2 = float, class:^(blueman-manager)$
windowrulev2 = float, class:^(nm-connection-editor)$
windowrulev2 = float, class:^(org.gnome.Calculator)$
windowrulev2 = size 540 720, class:^(org.gnome.Calculator)$
windowrulev2 = float, title:^(File Operation Progress)$

# Browser/media windows stay fully opaque (no blur cost).
windowrulev2 = opaque, class:^(firefox)$
windowrulev2 = opaque, class:^(mpv)$
windowrulev2 = opaque, fullscreen:1

# Suppress shadows on tooltips / launcher.
layerrule = noanim, ^(selection)$
layerrule = blur,   waybar
layerrule = blur,   notifications
layerrule = blur,   wofi
layerrule = ignorezero, wofi
layerrule = ignorealpha 0.4, waybar

# ---- keybindings -----------------------------------------------------
$mod = SUPER

# App / shell shortcuts (macOS-leaning chord style).
bind = $mod,       SPACE, exec, wofi --show drun
bind = $mod,       RETURN, exec, kitty
bind = $mod,       E, exec, nautilus
bind = $mod,       B, exec, firefox
bind = $mod SHIFT, S, exec, grim -g "$(slurp)" - | swappy -f -
bind = $mod,       L, exec, hyprlock
bind = $mod,       N, exec, makoctl dismiss -a

# Window management.
bind = $mod,       Q, killactive
bind = $mod SHIFT, Q, exit
bind = $mod,       F, fullscreen, 0
bind = $mod SHIFT, F, fullscreen, 1
bind = $mod,       V, togglefloating
bind = $mod,       T, togglesplit
bind = $mod,       J, togglesplit

# Focus.
bind = $mod, left,  movefocus, l
bind = $mod, right, movefocus, r
bind = $mod, up,    movefocus, u
bind = $mod, down,  movefocus, d

# Move window.
bind = $mod SHIFT, left,  movewindow, l
bind = $mod SHIFT, right, movewindow, r
bind = $mod SHIFT, up,    movewindow, u
bind = $mod SHIFT, down,  movewindow, d

# Workspaces 1..9 + special.
bind = $mod, 1, workspace, 1
bind = $mod, 2, workspace, 2
bind = $mod, 3, workspace, 3
bind = $mod, 4, workspace, 4
bind = $mod, 5, workspace, 5
bind = $mod, 6, workspace, 6
bind = $mod, 7, workspace, 7
bind = $mod, 8, workspace, 8
bind = $mod, 9, workspace, 9
bind = $mod SHIFT, 1, movetoworkspace, 1
bind = $mod SHIFT, 2, movetoworkspace, 2
bind = $mod SHIFT, 3, movetoworkspace, 3
bind = $mod SHIFT, 4, movetoworkspace, 4
bind = $mod SHIFT, 5, movetoworkspace, 5
bind = $mod SHIFT, 6, movetoworkspace, 6
bind = $mod SHIFT, 7, movetoworkspace, 7
bind = $mod SHIFT, 8, movetoworkspace, 8
bind = $mod SHIFT, 9, movetoworkspace, 9
bind = $mod, mouse_down, workspace, e+1
bind = $mod, mouse_up,   workspace, e-1

# Mouse drag/resize.
bindm = $mod, mouse:272, movewindow
bindm = $mod, mouse:273, resizewindow

# Volume / brightness / media.
bindel = , XF86AudioRaiseVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%+
bindel = , XF86AudioLowerVolume, exec, wpctl set-volume @DEFAULT_AUDIO_SINK@ 5%-
bindel = , XF86AudioMute,        exec, wpctl set-mute   @DEFAULT_AUDIO_SINK@ toggle
bindel = , XF86MonBrightnessUp,  exec, brightnessctl set 5%+
bindel = , XF86MonBrightnessDown, exec, brightnessctl set 5%-
bindl  = , XF86AudioPlay,        exec, playerctl play-pause
bindl  = , XF86AudioNext,        exec, playerctl next
bindl  = , XF86AudioPrev,        exec, playerctl previous

# Clipboard history.
bind = $mod, C, exec, cliphist list | wofi --dmenu | cliphist decode | wl-copy
