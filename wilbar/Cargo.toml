[package]
name        = "wilbar"
version     = "0.0.1"
edition     = "2021"
authors     = ["The WilOS authors"]
description = "Native Aurora top bar for WilOS (Wayland, GTK4)"
license     = "MIT"
repository  = "https://wilos.example/"
readme      = "README.md"
default-run = "wilbar"

[dependencies]
gtk            = { package = "gtk4", version = "0.9", features = ["v4_12"] }
gtk4-layer-shell = "0.4"
glib           = "0.20"
chrono         = { version = "0.4", features = ["clock"] }

[[bin]]
name = "wilbar"
path = "src/main.rs"

[profile.release]
lto             = "fat"
codegen-units   = 1
opt-level       = 3
strip           = "symbols"
