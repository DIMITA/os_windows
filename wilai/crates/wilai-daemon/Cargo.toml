[package]
name = "wilai-daemon"
version.workspace = true
edition.workspace = true
license.workspace = true
description = "Wilai daemon: Unix-socket-fronted agent for WilOS Aurora."

[lib]
name = "wilai_daemon"
path = "src/lib.rs"

[[bin]]
name = "wilai-daemon"
path = "src/main.rs"

[dependencies]
wilai-core.workspace = true
wilai-audit.workspace = true
wilai-tools.workspace = true
wilai-providers.workspace = true
anyhow.workspace = true
serde.workspace = true
serde_json.workspace = true
tokio.workspace = true
async-trait.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
clap.workspace = true
ulid.workspace = true

[dev-dependencies]
tempfile = "3"
tokio = { workspace = true, features = ["test-util"] }
