[package]
name = "wilai-hud"
version.workspace = true
edition.workspace = true
license.workspace = true
rust-version.workspace = true
description = "Wilai permanent HUD overlay — the Aurora robot face as a Wayland layer-shell panel over Hyprland. Pure Rust (SCTK + tiny-skia), no GTK."

[[bin]]
name = "wilai-hud"
path = "src/main.rs"

[dependencies]
wilai-core = { path = "../wilai-core" }
wilai-daemon = { path = "../wilai-daemon" }
anyhow.workspace = true
serde_json.workspace = true
tokio = { workspace = true }
clap.workspace = true
tracing.workspace = true
tracing-subscriber.workspace = true
smithay-client-toolkit = "0.19"
wayland-client = "0.31"
tiny-skia = "0.11"
png = "0.17"
dirs.workspace = true
