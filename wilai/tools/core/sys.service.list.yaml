name: sys.service.list
version: 1
description: List systemd units, optionally filtered by state (running, failed, enabled) or unit-file glob.
category: read
risk: none

inputs:
  state:
    type: enum
    required: false
    values: [running, failed, exited, listening, active, inactive, all]
    default: running
    description: Filter by LOAD/ACTIVE/SUB state. "all" lists every unit.
  pattern:
    type: string
    required: false
    default: "*"
    pattern: "^[a-zA-Z0-9@._*?\\-]*$"
    description: >
      Optional SHELL GLOB (not regex) to filter by unit name. Use "*"
      for any chars, "?" for one char, hyphens are literal.
      Examples: "wilai-*", "systemd-*", "nginx.service". Leave EMPTY
      ("") to list every unit matching the state filter. DO NOT pass
      regex syntax like "systemd.*" — that is a glob meaning
      "systemd" + literal dot + anything, and matches nothing because
      units are named "systemd-journald", "systemd-logind" with
      hyphens.

executor:
  type: subprocess
  cmd: ["systemctl", "--no-pager", "--no-legend", "list-units", "--type=service", "--state={state}", "{pattern}"]
  timeout_s: 10
  output:
    capture: stdout
    max_bytes: 65536

audit:
  fields: [state, pattern]

examples:
  - args: { state: "running" }
    note: "What services are running right now?"
  - args: { state: "failed" }
    note: "What services have failed since boot?"
