# WilOS-Aurora Hyprland snippet for the Wilai HUD overlay.
#
# wilai-hud uses the zwlr_layer_shell_v1 Overlay layer, so Hyprland
# natively keeps it pinned above all windows. These extra rules make
# the HUD play nice with workspace changes and specialwide layouts.
#
# Source this from ~/.config/hypr/hyprland.conf with:
#   source = /usr/share/wilai/hyprland/wilai-hud.conf
# or copy it into your conf.

# Layer-shell rules: no shadow, no blur, no reserved area (the HUD
# sits above and should not shift app windows).
layerrule = noanim, wilai-hud
layerrule = ignorealpha 0.0, wilai-hud
layerrule = noblur, wilai-hud

# Autostart on graphical login. Systemd user unit already does this on
# WilOS; keep this line as a hint for users who don't use the unit.
# exec-once = wilai-hud --anchor top-right --margin 12
