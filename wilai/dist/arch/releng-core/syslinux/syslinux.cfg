SERIAL 0 115200
UI vesamenu.c32
MENU TITLE WilOS-Core
MENU BACKGROUND #000000
MENU COLOR title 1;36;44 #ffffffff #00000000 std
MENU COLOR sel   7;37;40 #ff000000 #ffffffff all
TIMEOUT 50
DEFAULT wilos

LABEL wilos
    MENU LABEL Boot WilOS-Core live
    LINUX /arch/boot/x86_64/vmlinuz-linux
    INITRD /arch/boot/intel-ucode.img,/arch/boot/amd-ucode.img,/arch/boot/x86_64/initramfs-linux.img
    APPEND archisobasedir=arch archisolabel=%ARCHISO_LABEL% rw quiet
