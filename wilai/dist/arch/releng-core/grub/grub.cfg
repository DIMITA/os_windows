# WilOS-Core GRUB config (EFI boot path).
set default="0"
set timeout=5
set gfxmode="auto"
set gfxpayload="keep"
insmod all_video
insmod gfxterm
insmod part_gpt
insmod part_msdos
insmod fat
insmod iso9660
insmod ext2
insmod btrfs
insmod f2fs
terminal_output gfxterm

menuentry "WilOS-Core live" --class wilos --class arch --class gnu-linux --class gnu --class os {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=%ARCHISO_LABEL% rw quiet
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}

menuentry "WilOS-Core live (verbose)" {
    set gfxpayload=keep
    search --no-floppy --set=root --label %ARCHISO_LABEL%
    linux /arch/boot/x86_64/vmlinuz-linux archisobasedir=arch archisolabel=%ARCHISO_LABEL% rw debug
    initrd /arch/boot/intel-ucode.img /arch/boot/amd-ucode.img /arch/boot/x86_64/initramfs-linux.img
}
