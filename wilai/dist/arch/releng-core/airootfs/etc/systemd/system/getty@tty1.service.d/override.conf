[Unit]
# WilOS-Core replaces the tty1 getty with wilai-shell.service. Masking
# via /dev/null in multi-user.target.wants would also work; a drop-in
# that disables ExecStart is less surprising and leaves other ttys
# untouched.
[Service]
ExecStart=
ExecStart=/bin/true
# Make systemd not restart it (so wilai-shell.service wins the tty).
Restart=no
