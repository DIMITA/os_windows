[workspace]
resolver = "2"
members = [
    "crates/wilai-core",
    "crates/wilai-audit",
    "crates/wilai-tools",
    "crates/wilai-providers",
    "crates/wilai-daemon",
    "crates/wilai-voice",
    "crates/wilai-overlay",
    "crates/wilai-cli",
]

[workspace.package]
version = "0.5.0"
edition = "2021"
license = "MIT OR Apache-2.0"
rust-version = "1.75"

[workspace.dependencies]
anyhow = "1"
thiserror = "1"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
serde_yaml = "0.9"
toml = "0.8"
tokio = { version = "1", features = ["macros", "rt-multi-thread", "fs", "io-util", "io-std", "sync", "signal", "time", "process", "net"] }
reqwest = { version = "0.12", default-features = false, features = ["json", "rustls-tls"] }
clap = { version = "4", features = ["derive"] }
tracing = "0.1"
tracing-subscriber = { version = "0.3", features = ["env-filter"] }
time = { version = "0.3", features = ["serde", "formatting", "macros"] }
ulid = { version = "1", features = ["serde"] }
sha2 = "0.10"
hex = "0.4"
async-trait = "0.1"
dirs = "5"
ed25519-dalek = { version = "2", features = ["rand_core"] }
rand_core = { version = "0.6", features = ["std"] }

wilai-core = { path = "crates/wilai-core" }
wilai-audit = { path = "crates/wilai-audit" }
wilai-tools = { path = "crates/wilai-tools" }
wilai-providers = { path = "crates/wilai-providers" }
wilai-daemon = { path = "crates/wilai-daemon" }
wilai-voice = { path = "crates/wilai-voice" }
wilai-overlay = { path = "crates/wilai-overlay" }

[profile.release]
lto = "thin"
strip = true
